{% extends "recetas/base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
    <section class="card form-card">
        <h1>Crear cuenta</h1>
        <p class="meta" style="margin-top:0;">Se te asignará el rol Usuario automáticamente.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">Registrarme</button>
        </form>
        <p class="meta" style="margin:16px 0 0; text-align:center;">
            ¿Ya tienes cuenta? <a href="{% url 'recetas:login' %}">Inicia sesión</a>
        </p>
    </section>
{% endblock %}
