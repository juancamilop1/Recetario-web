<!DOCTYPE html>
<html>
<head>
    <title>{{ receta.nombre }}</title>
</head>

<body>

    <h1>{{ receta.nombre }}</h1>
    <ul>
        {% for opcion in receta.opcion_set.all %}
            <li>{{ opcion.opcion_texto }} -- {{ opcion.votos }} voto{{ opcion.votos|pluralize }}</li>
        {% endfor %}
    </ul>

    <a href="{% url 'recetas:detalle_receta' receta.id %}">Votar de nuevo</a>

    <br>

    <a href="{% url 'recetas:lista_recetas' %}">
        Volver al recetario
    </a>

</body>
</html>
