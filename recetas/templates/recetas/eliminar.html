{% extends "recetas/base.html" %}

{% block title %}Eliminar receta{% endblock %}

{% block content %}
    <section class="card form-card">
        <h1>Eliminar receta</h1>
        <p>¿Seguro que deseas eliminar <strong>{{ receta.nombre }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post" class="actions" style="margin-top:18px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a class="btn btn-secondary" href="{% url 'recetas:detalle_receta' receta.id %}">Cancelar</a>
        </form>
    </section>
{% endblock %}
