{% extends "recetas/base.html" %}

{% block title %}Eliminar receta{% endblock %}

{% block content %}
    <h1>Eliminar receta</h1>
    <p>¿Seguro que deseas eliminar <strong>{{ receta.nombre }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'recetas:detalle_receta' receta.id %}">Cancelar</a>
    </form>
{% endblock %}
