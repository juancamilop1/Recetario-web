{% extends "recetas/base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
    <div style="margin-bottom:14px;">
        <a href="{% url 'recetas:lista_recetas' %}">&larr; Volver al recetario</a>
    </div>

    <section class="card form-card">
        <h1>{{ titulo }}</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="actions" style="margin-top:16px;">
                <button type="submit" class="btn btn-primary">Guardar receta</button>
                {% if receta %}
                    <a class="btn btn-secondary" href="{% url 'recetas:detalle_receta' receta.id %}">Cancelar</a>
                {% else %}
                    <a class="btn btn-secondary" href="{% url 'recetas:lista_recetas' %}">Cancelar</a>
                {% endif %}
            </div>
        </form>
    </section>
{% endblock %}
