{% extends "recetas/base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

    <p><a href="{% url 'recetas:lista_recetas' %}">Volver al recetario</a></p>
{% endblock %}
